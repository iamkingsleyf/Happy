# =============================================================================
# docker-compose.yml
# Happy — Seedream 5.0 Pro playground stack.
# Same Dokploy networking pattern as IMGverse Search:
#   nginx is the only container on dokploy-network; app stays internal.
#
# @package Happy
# @since   1.0.0
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # nginx — reverse proxy. The ONLY container on dokploy-network.
  # Traefik routes external HTTPS traffic here; nginx proxies to the app
  # container on the internal network.
  # ---------------------------------------------------------------------------
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - dokploy-network
      - internal
    deploy:
      resources:
        limits:
          cpus: "${NGINX_CPU_LIMIT:-0.5}"
          memory: "${NGINX_MEMORY_LIMIT:-128M}"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # app — Node.js/Express: Fal.ai proxy + static playground UI.
  # Internal only — never exposed to the outside world directly.
  # ---------------------------------------------------------------------------
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    env_file: .env
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "${APP_CPU_LIMIT:-1.0}"
          memory: "${APP_MEMORY_LIMIT:-512M}"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

networks:
  dokploy-network:
    external: true
  internal:
    driver: bridge
