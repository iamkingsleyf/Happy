<!--
  index.html
  Happy — mobile-first Seedream playground (Tailwind CSS).

  @package Happy
  @since   1.0.0
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0c0b0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Happy</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff7a59'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: {
                            950: '#0c0b0a',
                            900: '#141210',
                            800: '#1c1916',
                            700: '#2a2521',
                        },
                        peach: {
                            300: '#ffb399',
                            400: '#ff8f6b',
                            500: '#ff7a59',
                        },
                        sand: {
                            50: '#faf6f1',
                            200: '#e8dfd4',
                            400: '#b9a99a',
                        },
                    },
                    fontFamily: {
                        sans: ['Figtree', 'ui-rounded', 'system-ui', 'sans-serif'],
                    },
                    boxShadow: {
                        sheet: '0 -12px 40px rgba(0,0,0,0.45)',
                    },
                },
            },
        };
    </script>
    <style>
        textarea, input, select { font-size: 16px !important; }
        textarea { field-sizing: content; }
        .safe-bottom { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
    </style>
</head>
<body class="min-h-dvh bg-[#1a1613] font-sans text-sand-50 antialiased">
    <div class="mx-auto flex min-h-dvh w-full max-w-[430px] flex-col bg-ink-950 shadow-[0_0_80px_rgba(0,0,0,0.45)]">

        <header class="sticky top-0 z-20 border-b border-white/5 bg-ink-950/90 px-4 pb-3 pt-[max(0.75rem,env(safe-area-inset-top))] backdrop-blur-xl">
            <div class="mb-3 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="flex h-8 w-8 items-center justify-center rounded-xl bg-gradient-to-br from-peach-400 to-[#ff4d6d] text-white shadow-lg shadow-peach-500/20">
                        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-6.5-4.35-9.33-8.22C.8 10.4 1.1 6.9 3.7 5.2c2.1-1.37 4.7-.7 6.1 1.2C11.2 4.5 13.8 3.83 15.9 5.2c2.6 1.7 2.9 5.2 1.03 7.58C18.5 16.65 12 21 12 21z"/></svg>
                    </span>
                    <h1 class="text-lg font-extrabold tracking-tight">Happy</h1>
                </div>
            </div>

            <div class="grid grid-cols-3 rounded-2xl bg-ink-800 p-1" role="tablist" aria-label="What do you want to do">
                <button type="button" data-mode="generate" class="mode-btn rounded-xl px-2 py-2.5 text-sm font-semibold text-ink-950 bg-sand-50">Create</button>
                <button type="button" data-mode="edit" class="mode-btn rounded-xl px-2 py-2.5 text-sm font-semibold text-sand-400">Edit</button>
                <button type="button" data-mode="layerize" class="mode-btn rounded-xl px-2 py-2.5 text-sm font-semibold text-sand-400">Split</button>
            </div>
        </header>

        <main id="stage" class="flex flex-1 flex-col px-4 pb-4 pt-5">
            <section id="empty-state" class="flex flex-1 flex-col items-center justify-center px-6 text-center">
                <div class="mb-4 flex h-16 w-16 items-center justify-center rounded-3xl bg-ink-800 text-peach-400">
                    <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                </div>
                <h2 id="empty-title" class="text-xl font-bold tracking-tight">Make a new picture</h2>
                <p id="empty-copy" class="mt-2 max-w-[18rem] text-[15px] leading-relaxed text-sand-400">Type what you want in the box below. Then tap Make and wait about a minute.</p>
            </section>

            <section id="result-state" class="hidden flex-1 space-y-4"></section>

            <section id="busy-state" class="hidden flex-1 flex-col items-center justify-center px-6 text-center">
                <div class="mb-4 h-12 w-12 animate-spin rounded-full border-[3px] border-white/10 border-t-peach-400" aria-hidden="true"></div>
                <p class="text-lg font-bold">Working on it…</p>
                <p id="busy-elapsed" class="mt-2 text-[15px] leading-relaxed text-sand-400">Keep this page open. Usually about a minute.</p>
            </section>
        </main>

        <footer id="composer" class="sticky bottom-0 z-20 border-t border-white/5 bg-ink-900/95 px-3 pt-3 backdrop-blur-xl safe-bottom">
            <div id="error" class="mb-3 hidden rounded-2xl bg-rose-500 px-4 py-3 text-[15px] font-semibold leading-snug text-white" role="alert"></div>

            <div id="refs" class="mb-2 hidden gap-2 overflow-x-auto"></div>
            <p id="photo-guide" class="mb-3 hidden px-0.5 text-[13px] leading-snug text-sand-400"></p>

            <label class="sr-only" for="prompt">What you want</label>
            <textarea
                id="prompt"
                rows="2"
                placeholder="Example: a birthday cake with pink flowers"
                class="w-full resize-none rounded-2xl border border-white/10 bg-ink-800 px-4 py-3 text-[16px] leading-relaxed text-sand-50 placeholder:text-sand-400/70 focus:border-peach-400 focus:outline-none"
            ></textarea>

            <div class="mt-3 flex items-center gap-2">
                <button type="button" id="btn-add-photo" class="hidden h-12 shrink-0 items-center justify-center rounded-2xl bg-ink-800 px-3 text-base font-semibold text-sand-50" aria-label="Add a pic from your phone">
                    Pic
                </button>
                <button type="button" id="btn-options" class="h-12 shrink-0 rounded-2xl bg-ink-800 px-3 text-base font-semibold text-sand-50">Size</button>
                <button type="button" id="btn-run" class="h-12 min-w-0 flex-1 rounded-2xl bg-peach-500 text-base font-bold text-ink-950 shadow-lg shadow-peach-500/20">Make</button>
            </div>
            <input id="file-input" type="file" accept="image/*" class="hidden" multiple>
        </footer>
    </div>

    <dialog id="options" class="w-full max-w-[430px] rounded-t-3xl border-0 bg-ink-800 p-0 text-sand-50 shadow-sheet backdrop:bg-black/60">
        <form method="dialog" class="px-5 pb-6 pt-4 safe-bottom">
            <div class="mx-auto mb-4 h-1 w-10 rounded-full bg-white/20"></div>
            <h3 class="mb-4 text-lg font-bold">Picture size</h3>

            <p class="mb-2 text-sm text-sand-400">Pick how the picture should look.</p>
            <div id="size-pills" class="mb-5 flex flex-wrap gap-2">
                <button type="button" data-size="auto_2K" class="size-pill rounded-full bg-sand-50 px-3 py-2 text-sm font-semibold text-ink-950">Best</button>
                <button type="button" data-size="square_hd" class="size-pill rounded-full bg-white/5 px-3 py-2 text-sm font-semibold">Square</button>
                <button type="button" data-size="portrait_16_9" class="size-pill rounded-full bg-white/5 px-3 py-2 text-sm font-semibold">Tall</button>
                <button type="button" data-size="landscape_16_9" class="size-pill rounded-full bg-white/5 px-3 py-2 text-sm font-semibold">Wide</button>
            </div>

            <div id="count-block">
                <p class="mb-2 text-sm font-semibold text-sand-400">How many pictures?</p>
                <div class="mb-5 flex gap-2">
                    <button type="button" data-count="1" class="count-pill flex-1 rounded-2xl bg-sand-50 py-3 text-sm font-semibold text-ink-950">1</button>
                    <button type="button" data-count="2" class="count-pill flex-1 rounded-2xl bg-white/5 py-3 text-sm font-semibold">2</button>
                    <button type="button" data-count="4" class="count-pill flex-1 rounded-2xl bg-white/5 py-3 text-sm font-semibold">4</button>
                </div>
            </div>

            <button type="submit" class="h-12 w-full rounded-2xl bg-peach-500 font-bold text-ink-950">Done</button>
        </form>
    </dialog>

    <script src="/app.js?v=1.0.1"></script>
</body>
</html>
